[package]
name = "idp-proto"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
uniffi = ["dep:uniffi", "transit-core/uniffi"]
client = ["transit-core/client"]
async-io = ["transit-core/async-io"]
tokio = ["transit-core/tokio"]
server = ["transit-core/server"]

[dependencies]
bitcode = "0.6.9"
serde = { version = "1.0", features = ["derive"] }
snafu = { version = "0.9.2", features = ["unstable-provider-api"] }
transit-core = { path = "../../transit", features = ["nightly"] }
xxhash-rust = { version = "0.8.18", features = ["const_xxh3"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
uniffi = { version = "=0.31.0", optional = true, features = ["cli"] }

[target.'cfg(target_family = "wasm")'.dependencies]
transit-core = { path = "../../transit", features = ["client"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
