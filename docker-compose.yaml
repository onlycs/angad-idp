name: idp-stack

services:
  server:
    build:
      context: ./src-idp
      dockerfile: Dockerfile
    container_name: server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LDAP_URL: ldap://ldap:389
    ports:
      - "${SERVER_PORT:-8080}:8080"   # adjust the container port to what src-idp listens on
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_started
    networks: [backend]

  ldap:
    build:
      context: ./src-ldap
      dockerfile: Dockerfile
    container_name: ldap
    restart: unless-stopped
    env_file: .env
    ports:
      - "${LDAP_PORT:-389}:389"       # adjust if src-ldap listens elsewhere (e.g. 3389/636)
    volumes:
      - ldap-data:/var/lib/ldap
    networks: [backend]

  authelia:
    image: authelia/authelia:4.38
    container_name: authelia
    restart: unless-stopped
    volumes:
      - ./authelia:/config            # put configuration.yml here
    environment:
      TZ: ${TZ:-UTC}
      # Secrets
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      # Storage -> Postgres
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: tcp://postgres:5432
      AUTHELIA_STORAGE_POSTGRES_DATABASE: ${AUTHELIA_DB:-authelia}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${POSTGRES_USER}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Sessions -> Redis
      AUTHELIA_SESSION_REDIS_HOST: redis
      AUTHELIA_SESSION_REDIS_PORT: "6379"
      # Users -> your LDAP container
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_ADDRESS: ldap://ldap:389
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${LDAP_BIND_PASSWORD}
    ports:
      - "${AUTHELIA_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_started
    networks: [backend]

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AUTHELIA_DB: ${AUTHELIA_DB:-authelia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - .docker/postgres-init.sh:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
  ldap-data:
