name: idp

services:
  server:
    build:
      dockerfile: Dockerfile.api
    container_name: server
    env_file:
      - src-idp/.env
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${IDP_DB}
      TLS_CERT: /certs/fullchain.pem
      TLS_KEY: /certs/key.pem
    ports:
      - "23849:23849"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authelia-config:/config
      - /var/lib/acme/dev.angad.page:/certs:ro
    networks: [backend]

  ldap:
    build:
      dockerfile: Dockerfile.ldap
    container_name: ldap
    restart: unless-stopped
    environment:
      TRANSIT_ADDRESS: "127.0.0.1"
      TRANSIT_PORT: "23849"
    depends_on:
      server:
        condition: service_started
    network_mode: service:server

  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    restart: unless-stopped
    volumes:
      - authelia-config:/config
      - .docker/favicon.ico:/assets/favicon.ico
      - .docker/logo.png:/assets/logo.png
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      # Secrets
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      # Storage -> Postgres
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: tcp://postgres:5432
      AUTHELIA_STORAGE_POSTGRES_DATABASE: ${DB_AUTHELIA}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${POSTGRES_USER}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Sessions -> Redis
      AUTHELIA_SESSION_REDIS_HOST: redis
      AUTHELIA_SESSION_REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_started
    network_mode: service:server

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${IDP_DB}
      AUTHELIA_DB: ${AUTHELIA_DB:-authelia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - .docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${IDP_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/acme/dev.angad.page:/certs:ro
      - caddy-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [server, authelia]
    networks:
      backend:
        aliases:
          - idp.dev.angad.page
          - auth.dev.angad.page

networks:
  backend:
    driver_opts:
      com.docker.network.bridge.name: br-idp

volumes:
  caddy-data:
  postgres-data:
  redis-data:
  authelia-config:
