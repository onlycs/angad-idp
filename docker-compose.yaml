name: idp

services:
  server:
    build:
      dockerfile: Dockerfile.api
    container_name: server
    env_file:
      - src-idp/.env
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${IDP_DB}
    ports:
      - "23849:23849"
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/23849"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authelia-config:/config
    networks: [backend]

  ldap:
    build:
      dockerfile: Dockerfile.ldap
    container_name: ldap
    restart: unless-stopped
    environment:
      TRANSIT_ADDRESS: "server"
      TRANSIT_PORT: "23849"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/389"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  authelia:
    image: authelia/authelia:4.39
    container_name: authelia
    restart: unless-stopped
    volumes:
      - authelia-config:/config
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      # Secrets
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      # Storage -> Postgres
      AUTHELIA_STORAGE_POSTGRES_ADDRESS: tcp://postgres:5432
      AUTHELIA_STORAGE_POSTGRES_DATABASE: ${AUTHELIA_DB}
      AUTHELIA_STORAGE_POSTGRES_USERNAME: ${POSTGRES_USER}
      AUTHELIA_STORAGE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Sessions -> Redis
      AUTHELIA_SESSION_REDIS_HOST: redis
      AUTHELIA_SESSION_REDIS_PORT: "6379"
      # Users -> your LDAP container
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_ADDRESS: ldap://ldap:389
    ports:
      - "${AUTHELIA_PORT:-9091}:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap:
        condition: service_healthy
      server:
        condition: service_healthy
    networks: [backend]

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${IDP_DB}
      AUTHELIA_DB: ${AUTHELIA_DB:-authelia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - .docker/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${IDP_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
  authelia-config:
