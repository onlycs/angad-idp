[package]
name = "idp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
bitcode = "0.6.9"
bollard = { version = "0.21.1", optional = true }
chrono = "0.4.45"
cuid2 = "0.1.6"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "pkcs8", "pem"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hex = "0.4.3"
hmac = "0.13.0"
idp-proto = { version = "0.1.0", path = "../src-proto" }
itertools = "0.15.0"
jsonwebtoken = "11.1.0"
k8s-openapi = { version = "0.28.0", optional = true, features = ["earliest"] }
kube = { version = "4.2.0", optional = true, default-features = false, features = ["aws-lc-rs", "client", "rustls-tls"] }
lettre = { version = "0.11.23", features = ["tokio1", "tokio1-native-tls"] }
regex = "1.13.1"
rsa = { version = "0.9.10", features = ["pem"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
sha2 = "0.11.0"
snafu = { version = "0.9.2", features = ["unstable-provider-api"] }
sqlx = { path = "../thirdparty/sqlx", features = ["chrono", "postgres", "runtime-tokio"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
transit-core = { git = "https://codeberg.org/tendulkar/transit", version = "0.2.0", features = ["nightly"] }
transit-server = { git = "https://codeberg.org/tendulkar/transit", version = "0.2.0" }
transit-tcp = { git = "https://codeberg.org/tendulkar/transit", version = "0.2.0", features = ["server"] }
transit-tls = { git = "https://codeberg.org/tendulkar/transit", version = "0.2.0", features = ["nightly", "server"] }
transit-tokio = { git = "https://codeberg.org/tendulkar/transit", version = "0.2.0" }
transit-ws = { git = "https://codeberg.org/tendulkar/transit", version = "0.2.0", features = ["nightly"] }
tungstenite = { version = "0.30.0", default-features = false }
type-signature = "0.1.3"
url = "2.5.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zxcvbn = "3.1.1"

[features]
default = ["k8s", "docker"]
k8s = ["dep:kube", "dep:k8s-openapi"]
docker = ["dep:bollard"]
