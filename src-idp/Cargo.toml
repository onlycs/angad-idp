[package]
name = "idp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
bitcode = "0.6.9"
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
idp-proto = { version = "0.1.0", path = "../src-proto", features = ["server", "tokio"] }
regex = "1.13.1"
sha2 = "0.11.0"
snafu = { version = "0.9.2", features = ["unstable-provider-api"] }
sqlx = { version = "0.9.0", features = ["chrono", "postgres", "runtime-tokio"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
transit-core = { git = "https://codeberg.org/tendulkar/transit", version = "0.1.0", features = ["nightly", "server", "tokio"] }
