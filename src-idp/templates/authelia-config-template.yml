# yaml-language-server: $schema=https://www.authelia.com/schemas/latest/json-schema/configuration.json
authentication_backend:
  refresh_interval: 5 minutes
  password_reset:
    disable: true
    custom_url: "{{ &*FRONTEND_URL }}/forgot"
  password_change:
    disable: true
  ldap:
    address: "ldap://127.0.0.1"
    implementation: custom
    timeout: 5s
    tls:
      skip_verify: true # TLS to actual IdP is handled by the outpost
    pooling:
      enable: false
      count: 5
      retries: 2
    base_dn: "dc=angad,dc=page"
    additional_users_dn: "ou=users"
    additional_groups_dn: "ou=groups"
    users_filter: "(&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))"
    groups_filter: "(&(member={dn})(objectClass=groupOfNames))"
    group_search_mode: filter
    permit_referrals: false
    user: "cn=$service,ou=users,dc=angad,dc=page"
    password: "{{ integration_key }}"
    attributes:
      username: "cn"
      mail: "mail"
      group_name: "cn"
      member_of: "memberOf"
totp:
  disable: false
  issuer: "Angad Auth"
webauthn:
  disable: false
  enable_passkey_login: true
  display_name: Angad Auth
regulation:
  modes:
    - ip
    - user
  max_retries: 5
  find_time: 2m
  ban_time: 5m
access_control:
  default_policy: two_factor
password_policy:
  zxcvbn:
    enabled: true
    min_score: 3
session:
  cookies:
    - domain: "{{ &*AUTHELIA_DOMAIN }}"
      authelia_url: "https://{{ &*AUTHELIA_DOMAIN }}"
  redis:
    tls:
      skip_verify: true # in-cluster, therefore idgaf sue me.
storage:
  postgres:
    schema: public
    tls:
      skip_verify: true # again, in-cluster
notifier:
  disable_startup_check: false
  smtp:
    identifier: "{{ &*AUTHELIA_DOMAIN }}"
    subject: "[Angad Auth] {title}"
telemetry:
  metrics:
    enabled: false # todo: long-term: LOKI
identity_providers:
  oidc:
    jwks:
      - algorithm: Ed25519
        key: |
          {{ ed25519_private | multilined(5) }}
      - algorithm: RS256
        key: |
          {{ rsa2048_private | multilined(5) }}
    cors:
      allowed_origins_from_client_redirect_uris: true
    authorization_policies:
      # {% for app in applications %}
      # {% if app.oidc.is_some() %}
      "{{ app.slug }}":
        default_policy: deny
        rules:
          - policy: two_factor
            subject:
              - "group:{{ app.slug }}:users"
              - "group:{{ app.slug }}:admins"
      # {% endif %}
      # {% endfor %}
    clients:
      # {% for app in applications %}
      # {% if let Some(oidc) = app.oidc.as_ref() %}
      - client_id: "{{ app.slug | xxh64 }}"
        client_name: "{{ app.name }}"
        authorization_policy: "{{ app.slug }}"
        # {% if let Some(secret) = oidc.client_secret_hash.as_ref() %}
        client_secret: "{{ secret }}"
        # {% else %}
        public: true
        require_pkce: true
        # {% endif %}
        pkce_challenge_method: S256
        redirect_uris:
          # {% for uri in oidc.redirect_uris %}
          - "{{ uri }}"
          # {% endfor %}
      # {% endif %}
      # {% endfor %}
