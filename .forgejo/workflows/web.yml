on: [push]

jobs:
  deploy:
    runs-on: docker
    env:
      API_URL: ${{ vars.API_URL }}
      AUTHELIA_URL: ${{ vars.AUTHELIA_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2

      - name: Rust nightly + wasm target
        uses: https://github.com/dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack (prebuilt binary)
        uses: https://github.com/taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Cache cargo build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: src-proto

      - run: bun install --frozen-lockfile && bun run build

      - name: Deploy (main) / preview upload (other branches)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ forgejo.ref }}
        run: |
          if [ "$REF" = refs/heads/main ]; then bunx wrangler deploy
          else bunx wrangler versions upload; fi
