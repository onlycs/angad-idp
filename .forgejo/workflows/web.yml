on: [push]
jobs:
  deploy:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bun run build
      - name: Deploy (main) / preview upload (other branches)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ forgejo.ref }}
          API_URL: ${{ vars.API_URL }}
          AUTHELIA_URL: ${{ vars.AUTHELIA_URL }}
        run: |
          if [ "$REF" = refs/heads/main ]; then bunx wrangler deploy
          else bunx wrangler versions upload; fi
