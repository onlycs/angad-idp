[package]
name = "transit-proto"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
uniffi = ["dep:uniffi", "transit-core/uniffi"]

[dependencies]
bitcode = "0.6.9"
snafu = "0.9.2"
transit-core = { version = "0.1.0", path = "../transit-core" }
xxhash-rust = { version = "0.8.18", features = ["const_xxh3"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
uniffi = { version = "0.32.1", optional = true, features = ["cli"] }

[target.'cfg(target_family = "wasm")'.dependencies]
transit-core = { version = "0.1.0", path = "../transit-core", features = ["client"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
